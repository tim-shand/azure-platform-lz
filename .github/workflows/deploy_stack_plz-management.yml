name: "Deploy Stack: PLZ-Management"

on:
    workflow_dispatch:
        inputs:
            action:
                description: "Action: Plan, Apply, Destroy"
                required: true
                default: "Plan"
                type: choice
                options:
                    - "Plan"
                    - "Apply"
                    - "Destroy"
    pull_request:
        paths:
            - ".github/workflows/stack_plz_management.yml"
            - "variables/plz-management.tfvars"
            - "deployments/plz-management/**"
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    # PLAN -------------------------------------------- #
    plan:
        if: |
            github.event_name == 'pull_request' ||
            github.event.inputs.action == 'Plan' ||
            github.event.inputs.action == 'Apply'
        uses: ./.github/workflows/terraform-plan.yml
        with: # Inputs passed to template job.
            stack_name: plz-management
            working_directory: ./deployments/plz-management
        secrets: # Secrets must be declared separately from inputs and passed explicitly.
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

    # APPLY -------------------------------------------- #
    apply:
        needs: plan # REQUIRES the plan job to succeed before running.
        if: github.event.inputs.action == 'Apply'
        uses: ./.github/workflows/terraform_apply.yml
        with: # Inputs passed to template job.
            stack_name: plz-management
            working_directory: ./deployments/plz-management
        secrets: # Secrets must be declared separately from inputs and passed explicitly.
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

    # DESTROY -------------------------------------------- #
    destroy:
        if: github.event.inputs.action == 'Destroy'
        uses: ./.github/workflows/terraform_destroy.yml
        with: # Inputs passed to template job.
            stack_name: plz-management
            working_directory: ./deployments/plz-management
        secrets: # Secrets must be declared separately from inputs and passed explicitly.
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
