name: "Terraform: Apply" # Display name shown in the GitHub Actions UI.

on: # Define workflow triggers.
    workflow_call: # Allows this workflow to be called by a parent workflow.
        inputs: # Define input parameters accepted from the calling workflow.
            working_directory: # Path to the Terraform stack root module.
                type: string
                required: true
            stack_name: # String used with plan and variable file naming.
                type: string
                required: true
            run_mode: # Pass in 'run_mode' to use as parameter in plan command (plan -destroy).
                type: string
                required: true
        secrets: # Secrets must be declared separately from inputs.
            ARM_CLIENT_ID: # Azure Service Principal ID for OIDC authentication.
                required: true

jobs:
    plan:
        name: "Terraform: Apply" # Display name for this job in the GitHub Actions UI.
        runs-on: ubuntu-latest # Use the latest GitHub-hosted Ubuntu runner.
        timeout-minutes: 45 # Fail the entire job if it exceeds this duration.
        defaults:
            run:
                working-directory: ${{ inputs.working_directory }} # All 'run' steps execute from this directory by default.

        env: # Environment variables available to all steps in this job.
            # Terraform Backend Config ----------------------------------- #
            TF_VERSION: ${{ vars.TF_VERSION }} # Terraform version to install, from GitHub environment variable.
            TF_BACKEND_RG: ${{ vars.TF_BACKEND_RESOURCE_GROUP }} # Azure Resource Group containing the backend Storage Account.
            TF_BACKEND_SA: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }} # Azure Storage Account used for Terraform remote states.
            TF_BACKEND_CONTAINER: "tfstate-${{ inputs.stack_name }}" # Blob container within the Storage Account holding state files.
            TF_BACKEND_KEY: "${{ inputs.stack_name }}.tfstate" # Filename of the state file within the container for the stack.
            # Stack Specific ----------------------------------- #
            STACK_NAME: ${{ inputs.stack_name }} # Stack name used for plan file and artifact naming.
            # Azure OIDC Authentication  ----------------------------------- #
            ARM_USE_OIDC: true # Force Terraform AzureRM provider to authenticate via OIDC.
            ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }} # Azure tenant ID, get from GitHub environment variable.
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }} # Azure Service Principal ID, sourced from GitHub secret.
            ARM_SUBSCRIPTION_ID_IAC: ${{ vars.SUBSCRIPTION_ID_IAC }} # Subscription containing the Terraform backend Storage Account.
            ARM_SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID_MGT }} # Target subscription for the stack resources.

        steps:
            - uses: actions/checkout@v4 # Clone the repository onto the runner.

            - uses: hashicorp/setup-terraform@v3 # Install Terraform CLI on the runner.
              with:
                  terraform_version: ${{ vars.TF_VERSION }} # Pin to the version defined in the GitHub environment variable.

            - name: "Terraform: Initialize"
              timeout-minutes: 5 # Fail this step if it exceeds 'x' minutes.
              run: |
                  terraform init \
                    -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID_IAC" \
                    -backend-config="resource_group_name=$TF_BACKEND_RG" \
                    -backend-config="storage_account_name=$TF_BACKEND_SA" \
                    -backend-config="container_name=$TF_BACKEND_CONTAINER" \
                    -backend-config="key=$TF_BACKEND_KEY" \
                    -backend-config="use_azuread_auth=true"

            - name: "Download Plan Artifact"
              uses: actions/download-artifact@v4
              with:
                  name: "${{ inputs.stack_name }}_${{ inputs.run_mode }}.plan" # Artifact name.
                  path: "${{ inputs.working_directory }}" # Path to the saved plan file produced in the plan step.

            - name: "Terraform: Apply"
              run: terraform apply --auto-approve "${{ inputs.stack_name }}_${{ inputs.run_mode }}.plan"
